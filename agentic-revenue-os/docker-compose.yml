services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aros-postgres
    environment:
      POSTGRES_USER: ctm
      POSTGRES_PASSWORD: ctm_dev_password
      POSTGRES_DB: agentic_revenue_os
    ports:
      - "5432:5432"
    volumes:
      - aros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctm -d agentic_revenue_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aros_pgdata:
