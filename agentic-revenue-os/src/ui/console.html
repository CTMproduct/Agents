<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Agentic Revenue OS — CTM En Línea</title>
<style>
  :root{
    --navy:#12263f;--navy2:#1b3a5c;--bg:#f4f6f9;--card:#fff;--ink:#22303e;--muted:#7a8794;
    --blue:#0b6bcb;--green:#12a150;--yellow:#e6a700;--red:#c62828;--purple:#7b4fd6;--teal:#0e8f8f;
  }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;overflow:hidden}
  /* Sidebar */
  aside{width:86px;background:var(--navy);display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:4px;flex-shrink:0}
  aside .logo{color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.5px;margin-bottom:10px;text-align:center}
  aside button{background:none;border:0;color:#9fb3c8;width:72px;padding:10px 2px;border-radius:10px;cursor:pointer;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:4px}
  aside button svg{width:22px;height:22px;fill:currentColor}
  aside button.active,aside button:hover{background:var(--navy2);color:#fff}
  aside .badge{background:var(--red);color:#fff;border-radius:9px;font-size:.62rem;padding:1px 6px;margin-top:-30px;margin-left:30px}
  /* Main */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{background:#fff;border-bottom:1px solid #e3e8ee;padding:12px 22px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.02rem;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:.8rem}
  header .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{background:#eaf3ff;color:var(--blue);border-radius:20px;padding:4px 12px;font-size:.78rem;font-weight:600}
  .pill.green{background:#e7f6ec;color:var(--green)}
  #content{flex:1;overflow:auto;padding:18px 22px}
  .hidden{display:none!important}
  /* Dashboard */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .stat{background:var(--navy);color:#fff;border-radius:12px;padding:18px}
  .stat .n{font-size:2rem;font-weight:800}
  .stat .l{font-size:.78rem;color:#9fb3c8;text-transform:uppercase;letter-spacing:.4px}
  .stat.light{background:var(--card);color:var(--ink);border:1px solid #e3e8ee}
  .stat.light .l{color:var(--muted)}
  .funnelbar{display:flex;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
  .funnelbar .fseg{flex:1;min-width:130px;background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:10px 12px;border-top:4px solid var(--blue)}
  .fseg .fn{font-weight:800;font-size:1.25rem}.fseg .fl{font-size:.72rem;color:var(--muted);text-transform:uppercase}
  /* Kanban */
  #board{display:flex;gap:14px;align-items:flex-start;min-height:70vh}
  .col{background:#eef1f5;border-radius:12px;min-width:250px;width:250px;padding:10px;flex-shrink:0;border-top:4px solid var(--blue)}
  .col h3{font-size:.78rem;letter-spacing:.5px;margin:4px 6px 10px;color:#4a5866;display:flex;justify-content:space-between}
  .col.drag{outline:2px dashed var(--blue)}
  .lead{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,40,70,.08);cursor:grab;border-left:3px solid transparent}
  .lead .nm{font-weight:700;font-size:.86rem;color:var(--blue)}
  .lead .dt{font-size:.76rem;color:var(--muted);margin-top:2px}
  .lead .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .score{font-size:.7rem;font-weight:700;border-radius:10px;padding:2px 8px;background:#e7f6ec;color:var(--green)}
  .score.mid{background:#fff6de;color:var(--yellow)} .score.low{background:#fdecea;color:var(--red)}
  .money{font-size:.76rem;color:var(--ink);font-weight:600}
  /* Approvals */
  .apr{background:#fff;border:1px solid #e3e8ee;border-radius:12px;padding:14px 16px;margin-bottom:14px;max-width:820px}
  .apr .meta{font-size:.8rem;color:var(--muted);margin-bottom:8px}
  .apr textarea{width:100%;min-height:88px;font:inherit;padding:10px;border:1px solid #d6dde5;border-radius:8px}
  .apr .acts{display:flex;gap:8px;margin-top:8px}
  .apr input{width:170px;padding:8px;border:1px solid #d6dde5;border-radius:8px}
  .btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;color:#fff;background:var(--green)}
  .btn.red{background:var(--red)} .btn.blue{background:var(--blue)}
  /* Chats */
  #chats{display:flex;gap:0;height:calc(100vh - 120px);background:#fff;border:1px solid #e3e8ee;border-radius:12px;overflow:hidden}
  #convlist{width:320px;border-right:1px solid #e3e8ee;overflow:auto;flex-shrink:0}
  .conv{padding:12px 14px;border-bottom:1px solid #eef1f5;cursor:pointer}
  .conv:hover,.conv.sel{background:#eaf3ff}
  .conv .cn{font-weight:700;font-size:.86rem} .conv .cp{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .ct{font-size:.7rem;color:var(--muted)}
  #thread{flex:1;overflow:auto;padding:18px;background:#f7f9fb}
  .msg{max-width:65%;padding:9px 13px;border-radius:12px;margin-bottom:8px;font-size:.86rem;white-space:pre-wrap}
  .msg.in{background:#fff;border:1px solid #e3e8ee;border-bottom-left-radius:3px}
  .msg.out{background:#d9f2e3;margin-left:auto;border-bottom-right-radius:3px}
  .msg .mt{font-size:.66rem;color:var(--muted);margin-top:4px}
  .empty{color:var(--muted);text-align:center;margin-top:16vh;font-size:.9rem}
  h2.sec{font-size:.95rem;margin:4px 0 14px}
</style>
</head>
<body>
<aside>
  <div class="logo">CTM<br/>AGENTIC</div>
  <button id="nav-panel" onclick="show('panel')">
    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Panel</button>
  <button id="nav-board" onclick="show('board_v')">
    <svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z"/></svg>Embudo</button>
  <button id="nav-apr" onclick="show('apr_v')">
    <svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.5-1.5z"/></svg>Aprobar</button>
  <button id="nav-chats" onclick="show('chats_v')">
    <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>Chats</button>
</aside>
<main>
  <header>
    <h1 id="title">Panel de control</h1>
    <span class="sub" id="subtitle"></span>
    <div class="right">
      <span class="pill green" id="hpill">● en línea</span>
      <span class="pill" id="ppill">0 pendientes</span>
    </div>
  </header>
  <div id="content">
    <section id="panel">
      <div class="funnelbar" id="funnel"></div>
      <div class="grid" id="statgrid"></div>
    </section>
    <section id="board_v" class="hidden"><div id="board"></div></section>
    <section id="apr_v" class="hidden"><h2 class="sec">Respuestas pendientes de aprobación — Autonomía L0: nada se envía sin visto bueno humano</h2><div id="aprlist"></div></section>
    <section id="chats_v" class="hidden">
      <div id="chats">
        <div id="convlist"></div>
        <div id="thread"><p class="empty">Selecciona una conversación</p></div>
      </div>
    </section>
  </div>
</main>
<script>
const STAGES=[
  ['NEW','Leads entrantes','#0b6bcb'],
  ['QUALIFIED','Calificado','#0e8f8f'],
  ['IN_PROGRESS','Cotización / gestión','#7b4fd6'],
  ['ESCALATED','Escalado a humano','#e6a700'],
  ['WON','Ganado','#12a150'],
  ['LOST','Perdido','#c62828'],
];
const INTENTS={INFORMATION:'Información',QUOTE_REQUEST:'Cotización',READY_TO_BOOK:'Listo para reservar',POST_SALE:'Postventa',COMPLAINT:'Queja',UNKNOWN:'—'};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=d=>new Date(d).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const money=(a,c)=>a?Number(a).toLocaleString('es-CO')+' '+(c||''):'';
let view='panel';

function show(v){
  view=v;
  for(const s of ['panel','board_v','apr_v','chats_v']) document.getElementById(s).classList.toggle('hidden',s!==v);
  document.querySelectorAll('aside button').forEach(b=>b.classList.remove('active'));
  ({panel:'nav-panel',board_v:'nav-board',apr_v:'nav-apr',chats_v:'nav-chats'})[v] &&
    document.getElementById(({panel:'nav-panel',board_v:'nav-board',apr_v:'nav-apr',chats_v:'nav-chats'})[v]).classList.add('active');
  document.getElementById('title').textContent={panel:'Panel de control',board_v:'Embudo de ventas',apr_v:'Aprobaciones',chats_v:'Conversaciones'}[v];
  refresh();
}

async function j(url,opts){const r=await fetch(url,opts);if(!r.ok)throw new Error(await r.text());return r.json();}

async function refresh(){
  try{
    const st=await j('/crm/stats');
    document.getElementById('ppill').textContent=st.pendingApprovals+' pendientes';
    document.getElementById('subtitle').textContent=st.totalLeads+' leads · '+st.conversations+' conversaciones';
    if(view==='panel')renderPanel(st);
    if(view==='board_v')renderBoard(await j('/crm/leads'));
    if(view==='apr_v')renderApprovals(await j('/approvals/pending'));
    if(view==='chats_v')renderConvs(await j('/crm/conversations'));
    const h=await j('/health');
    const hp=document.getElementById('hpill');
    hp.textContent=h.status==='ok'?'● en línea':'● degradado';
    hp.style.color=h.status==='ok'?'':'#c62828';
  }catch(e){console.error(e);}
}

function renderPanel(st){
  document.getElementById('funnel').innerHTML=STAGES.map(([k,l,c])=>
    `<div class="fseg" style="border-top-color:${c}"><div class="fn">${st.leadsByStatus[k]??0}</div><div class="fl">${l}</div></div>`).join('');
  const cards=[
    ['Leads totales',st.totalLeads],['Contactos',st.contacts],['Conversaciones',st.conversations],
    ['Mensajes',st.messages],['Corridas de agente',st.agentRuns],
    ['Confianza media',st.avgConfidence?(st.avgConfidence*100).toFixed(0)+'%':'—'],
    ['Latencia media IA',st.avgLatencyMs?(st.avgLatencyMs/1000).toFixed(1)+'s':'—'],
    ['Pendientes de aprobación',st.pendingApprovals],
  ];
  document.getElementById('statgrid').innerHTML=cards.map(([l,n],i)=>
    `<div class="stat ${i%2?'light':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function renderBoard(leads){
  const el=document.getElementById('board');
  el.innerHTML=STAGES.map(([k,l,c])=>{
    const ls=leads.filter(x=>x.status===k);
    return `<div class="col" style="border-top-color:${c}" data-st="${k}"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="drop(event,'${k}')">
      <h3>${l}<span>${ls.length}</span></h3>
      ${ls.map(x=>`<div class="lead" draggable="true" ondragstart="event.dataTransfer.setData('id','${x.id}')" style="border-left-color:${c}">
        <div class="nm">${esc(x.contact?.fullName||'Sin nombre')}</div>
        <div class="dt">${esc(x.destination||'Destino por definir')}${x.paxAdults?' · '+x.paxAdults+' adt'+(x.paxChildren?' + '+x.paxChildren+' chd':''):''}</div>
        <div class="dt">${INTENTS[x.intent]||x.intent} · ${fmt(x.updatedAt)}</div>
        <div class="row">
          ${x.score!=null?`<span class="score ${x.score>=0.7?'':x.score>=0.4?'mid':'low'}">${(x.score*100).toFixed(0)}%</span>`:'<span></span>'}
          <span class="money">${money(x.budgetAmount,x.budgetCurrency)}</span>
        </div>
      </div>`).join('')}
    </div>`;}).join('');
}

async function drop(ev,status){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  const id=ev.dataTransfer.getData('id');
  if(!id)return;
  try{
    await j('/crm/leads/'+id+'/status',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status,updatedBy:localStorage.getItem('who')||'consola'})});
    refresh();
  }catch(e){alert('No se pudo mover: '+e.message);}
}

function renderApprovals(rows){
  const who=localStorage.getItem('who')||'';
  document.getElementById('aprlist').innerHTML=rows.length?rows.map(r=>`
    <div class="apr" id="apr-${r.id}">
      <div class="meta"><b>${esc(r.conversation?.contact?.fullName||'Sin nombre')}</b> · ${r.conversation?.channel} · ${fmt(r.createdAt)}</div>
      <textarea id="tx-${r.id}">${esc(r.body)}</textarea>
      <div class="acts">
        <input id="wh-${r.id}" placeholder="tu nombre" value="${esc(who)}"/>
        <button class="btn" onclick="act('${r.id}','approve')">Aprobar y enviar</button>
        <button class="btn red" onclick="act('${r.id}','reject')">Rechazar</button>
      </div>
    </div>`).join('')
  :'<p class="empty">Nada pendiente. Los mensajes entrantes aparecerán aquí tras pasar por el agente.</p>';
}

async function act(id,action){
  const who=document.getElementById('wh-'+id).value.trim();
  if(!who){alert('Escribe tu nombre para la auditoría');return;}
  localStorage.setItem('who',who);
  const payload={approvedBy:who};
  if(action==='approve')payload.editedBody=document.getElementById('tx-'+id).value;
  try{
    await j('/approvals/'+id+'/'+action,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    document.getElementById('apr-'+id).remove();
    refresh();
  }catch(e){alert('Error: '+e.message);}
}

function renderConvs(rows){
  document.getElementById('convlist').innerHTML=rows.length?rows.map(c=>`
    <div class="conv" id="conv-${c.id}" onclick="openConv('${c.id}')">
      <div class="cn">${esc(c.contact?.fullName||'Sin nombre')} <small style="color:#7a8794">· ${c.channel}</small></div>
      <div class="cp">${esc(c.messages?.[0]?.body||'')}</div>
      <div class="ct">${c._count?.messages??''} mensajes · ${fmt(c.updatedAt)}</div>
    </div>`).join('')
  :'<p class="empty">Sin conversaciones aún.</p>';
}

async function openConv(id){
  document.querySelectorAll('.conv').forEach(x=>x.classList.remove('sel'));
  document.getElementById('conv-'+id)?.classList.add('sel');
  const c=await j('/crm/conversations/'+id);
  document.getElementById('thread').innerHTML=(c.messages||[]).map(m=>`
    <div class="msg ${m.direction==='INBOUND'?'in':'out'}">${esc(m.body)}<div class="mt">${m.direction==='INBOUND'?esc(c.contact?.fullName||'Cliente'):'CTM'} · ${fmt(m.createdAt)}</div></div>`).join('')
    ||'<p class="empty">Sin mensajes</p>';
}

show('panel');
setInterval(refresh,30000);
</script>
</body>
</html>
