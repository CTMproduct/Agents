services:
  - type: web
    name: nora-control
    runtime: node
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm run start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
