services:
  - type: web
    name: nora-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://ctm-analyzer-backend.onrender.com
      - key: VITE_REFRESH_INTERVAL
        value: 30000
      - key: VITE_ENABLE_REALTIME
        value: true
      - key: VITE_SHOW_HALLUCINATION_ANALYSIS
        value: true
      - key: VITE_SHOW_PERFORMANCE_METRICS
        value: true
      - key: VITE_SHOW_CONVERSATION_METRICS
        value: true

  - type: web
    name: ctm-analyzer-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nora-frontend.onrender.com
      - key: OPENAI_API_KEY
        secure: true
      - key: MONGODB_URI
        secure: true

